   <g id="text_1">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 700 11px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="18" y="25.92" transform="rotate(-0 18 25.92)">The GPU guard: handing the card back during the day</text>
   </g>
   <g id="text_2">
    <text style="text-anchor: start; fill: #52514e; font: normal 400 8.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="18" y="41.76" transform="rotate(-0 18 41.76)">Any one signal pauses the local models and frees the card. A watcher looks every 15 s, and the work carries on where it stopped.</text>
   </g>
   <g id="text_3">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="23.04" y="74.88" transform="rotate(-0 23.04 74.88)">a key or the mouse in the last 3</text>
   </g>
   <g id="text_4">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="23.04" y="85.32" transform="rotate(-0 23.04 85.32)">minutes</text>
   </g>
   <g id="text_5">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="23.04" y="116.64" transform="rotate(-0 23.04 116.64)">something fullscreen in front</text>
   </g>
   <g id="text_6">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="23.04" y="158.4" transform="rotate(-0 23.04 158.4)">another process holds 1,500 MB of</text>
   </g>
   <g id="text_7">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="23.04" y="168.84" transform="rotate(-0 23.04 168.84)">VRAM or more</text>
   </g>
   <g id="text_8">
    <text style="text-anchor: start; fill: #898781; font: normal 400 7px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="18" y="198" transform="rotate(-0 18 198)">any one signal</text>
   </g>
   <g id="text_9">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="219.6" y="92.88" transform="rotate(-0 219.6 92.88)">close the gate</text>
   </g>
   <g id="text_10">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="303.12" y="92.88" transform="rotate(-0 303.12 92.88)">let requests in</text>
   </g>
   <g id="text_11">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="303.12" y="103.32" transform="rotate(-0 303.12 103.32)">flight finish</text>
   </g>
   <g id="text_12">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="386.64" y="92.88" transform="rotate(-0 386.64 92.88)">stop the model</text>
   </g>
   <g id="text_13">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="386.64" y="103.32" transform="rotate(-0 386.64 103.32)">server: VRAM</text>
   </g>
   <g id="text_14">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="386.64" y="113.76" transform="rotate(-0 386.64 113.76)">freed</text>
   </g>
   <g id="text_15">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="470.16" y="92.88" transform="rotate(-0 470.16 92.88)">wait until</text>
   </g>
   <g id="text_16">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="470.16" y="103.32" transform="rotate(-0 470.16 103.32)">clear for 10</text>
   </g>
   <g id="text_17">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="470.16" y="113.76" transform="rotate(-0 470.16 113.76)">minutes</text>
   </g>
   <g id="text_18">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="553.68" y="92.88" transform="rotate(-0 553.68 92.88)">next request</text>
   </g>
   <g id="text_19">
    <text style="text-anchor: start; fill: #0b0b0b; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="553.68" y="103.32" transform="rotate(-0 553.68 103.32)">restarts it</text>
   </g>
   <g id="text_20">
    <text style="text-anchor: middle; fill: #52514e; font: normal 400 7px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="419.04" y="178.56" transform="rotate(-0 419.04 178.56)">a new signal pauses it again</text>
   </g>
   <g id="text_21">
    <text style="text-anchor: start; fill: #52514e; font: normal 400 7.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="216" y="216" transform="rotate(-0 216 216)">A pause never moves a deadline, and every pause and resume is logged with its reason.</text>
   </g>
  </g>
 </g>
