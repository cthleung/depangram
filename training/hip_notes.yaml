# The notes-to-text adapter, the one the loop's adapter arm uses. Same recipe as hip_mistral.yaml,
# different data and target: the model reads a notes list (the loop's own notes format, Sonnet's) and
# writes the author's paragraph. Leave casual chat out of the data (it teaches lowercase texting and
# typos); training/build_notes_pairs.py normalizes the passages to the document's register
# (capitalized sentences, straight quotes, American spelling). One row in four is a paraphrase-to-text
# pair for the same passage, so the model also learns "same content, your words".
model_name: mistralai/Mistral-Small-24B-Base-2501
run_name: hip_notes_mistral24b

# data: build_notes_pairs.py writes the pairs in your data folder; `--action upload --pairs FILE` copies
# that file to pairs_file on the data volume
pairs_file: /data/pairs_notes.jsonl
source_text_field: prompt_source      # pre-rendered: "<notes>\n- ...\n</notes>" or "<source_text>\n...\n</source_text>"
target_text_field: text
only_ok_pairs: true
sources: [samples, reddit]
max_train_samples: 0
holdout: 60

# the CMU recipe at two epochs: three overfit (the eval loss rose in the third)
seed: 42
max_length: 2048
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
num_train_epochs: 2.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
logging_steps: 10
bf16: true
gradient_checkpointing: true
attn_implementation: sdpa

load_in_4bit: false
lora_r: 128
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# the source carries its own tags, so the template only adds the target's
template: "{source}\n<target_text>\n{target}\n</target_text>"
